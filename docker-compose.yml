version: '3.8'
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: planify
      POSTGRES_PASSWORD: planify
      POSTGRES_DB: planify
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://planify:planify@db:5432/planify
      JWT_SECRET: dev-secret
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db-data:
